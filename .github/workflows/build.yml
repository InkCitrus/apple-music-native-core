name: Native core bundles
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      plugin_commit:
        description: 'Optional MyGo Apple Music plugin commit to package for testing (full SHA)'
        required: false
        type: string
concurrency:
  group: native-bundles-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: ubuntu-22.04
            platform: linux-amd64
          - os: windows-latest
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            make git mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-lld
      - name: Configure Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          '${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          'AMCORE_MSYS=${{ steps.msys2.outputs.msys2-location }}' | Out-File -FilePath $env:GITHUB_ENV -Append
          'CC=gcc' | Out-File -FilePath $env:GITHUB_ENV -Append
          'CXX=g++' | Out-File -FilePath $env:GITHUB_ENV -Append
          'CGO_ENABLED=1' | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test portable libraries
        run: go test -race ./...
      - name: Test compiled synthetic SDK transport
        if: runner.os != 'Windows'
        run: python3 scripts/test_native.py
      - name: Build native bundle
        if: runner.os != 'Windows'
        run: python3 scripts/build.py
      - name: Build Windows native bundle
        if: runner.os == 'Windows'
        run: python scripts/build.py --msys "$env:AMCORE_MSYS"
      - name: Build optional native demo window
        if: runner.os == 'macOS'
        run: python3 examples/miniplayer/build_macos.py
      - name: Check Windows bundle without compiler on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & .\build\bundle\amcore.exe version
          if ($LASTEXITCODE -ne 0) { throw 'Standalone core could not start' }
          & .\build\bundle\amcore-demo.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Direct Go player example could not start' }
      - name: Bundle source and dependency notices
        if: runner.os != 'Windows'
        run: python3 scripts/bundle_sources.py
      - name: Bundle Windows source and dependency notices
        if: runner.os == 'Windows'
        run: python scripts/bundle_sources.py --msys "$env:AMCORE_MSYS"
      - uses: actions/upload-artifact@v4
        with:
          name: amcore-${{ matrix.platform }}
          path: build/bundle/
          retention-days: 14
          if-no-files-found: error
      - name: Attach demo source and notices
        if: runner.os == 'macOS'
        run: |
          cp build/bundle/corresponding-source.tar.gz build/bundle/LICENSE build/bundle/THIRD_PARTY.md build/demo/
          cp -R build/bundle/licenses build/demo/
          cp examples/miniplayer/README.md build/demo/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: amcore-demo-darwin-arm64
          path: build/demo/
          retention-days: 14
          if-no-files-found: error
      - name: Package release archives on the build runner
        run: python scripts/package_release.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: amcore-release-${{ matrix.platform }}
          path: build/release/
          retention-days: 14
          if-no-files-found: error

  plugin-test:
    if: github.event_name == 'workflow_dispatch' && inputs.plugin_commit != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the plugin revision and read the core version
        env:
          PLUGIN_COMMIT: ${{ inputs.plugin_commit }}
        run: |
          [[ "$PLUGIN_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          version=$(sed -n 's/^const Version = "\([0-9.]*\)"$/\1/p' service/service.go)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "CORE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: InkCitrus/mygo-music-apple-music
          ref: ${{ inputs.plugin_commit }}
          path: plugin
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: amcore-release-*
          path: core-artifacts
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Build and verify the plugin test packages
        working-directory: plugin
        env:
          PLUGIN_COMMIT: ${{ inputs.plugin_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$PLUGIN_COMMIT"
          npm ci
          python3 scripts/fetch_core_release.py --actions-bundles ../core-artifacts \
            --core-commit "$GITHUB_SHA" --core-version "$CORE_VERSION" --core-run "$GITHUB_RUN_ID"
          npm run typecheck
          npm run build
          npm test
          python3 scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: mygo-apple-music-test
          path: plugin/build/release/
          retention-days: 14
          if-no-files-found: error
